<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Register</title>
</head>

<body>

<form id="register-container">
    <h1>Create Admin Account</h1>

    <div id="form">
        <input type="text" id="username" placeholder="Choose Username" required>

        <input type="email" id="email" placeholder="Enter Email" required>

        <input type="password" id="password" placeholder="Choose Password" required>

        <button type="submit">Register</button>
    </div>

    <p class="login-link">
        Already have an account?
        <a href="/index.html">Login</a>
    </p>

    <p id="errorMsg" style="color:red;"></p>
    <p id="successMsg" style="color:green;"></p>
</form>


<style>

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: hsla(90, 11%, 93%, 1);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#register-container {
    background: #c3ffbc;
    padding: 40px;
    border-radius: 20px;
    width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);

    display: flex;
    flex-direction: column;
    gap: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
    color: #4f8988;
}

#form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    padding: 12px;
    border-radius: 10px;
    border: none;
    background-color: #4f8988;
    color: white;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background-color: #406e6e;
}

.login-link {
    text-align: center;
    font-size: 14px;
}

.login-link a {
    color: #4f8988;
    text-decoration: none;
    font-weight: bold;
}

.login-link a:hover {
    text-decoration: underline;
}

</style>

<script src="./js/auth.js"></script>

</body>
</html>
