<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
</head>
<body>

<form id="login-container">
    <h1>Admin Login</h1>

    <div id="form">
        <input type="text" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

        <p class="register-link">
        Dont have an account?
        <a href="/register">Register</a>
    </p>

    <p id="errorMsg" style="color:red;"></p>
    <p id="successMsg" style="color:green;"></p>
</div>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: hsla(90, 11%, 93%, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #login-container {
            background: #c3ffbc;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .register-link {
            text-align: center;
            font-size: 14px;
        }
    
        .register-link a {
            color: #4f8988;
            text-decoration: none;
            font-weight: bold;
        }
    
        .register-link a:hover {
            text-decoration: underline;
        }
    
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #4f8988;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 12px;
            border-radius: 10px;
            border: none;
            background-color: #4f8988;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        #form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button:hover {
            background-color: #406e6e;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>

    <script src="./js/auth.js"></script>

</body>
</html>
