<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel</title>
</head>

<body>

<header>
    <h1>Admin Dashboard</h1>
    <button id="logoutBtn">Logout</button>
</header>


<div class="container">

    <!-- CREATE -->
    <div class="card">
        <h2>Add Game</h2>

        <form id="createGameForm">

            <input type="text" id="title" placeholder="Game Title" required>
            <input type="text" id="price" placeholder="Price" required>
            <input type="text" id="genre" placeholder="Genre">
            <input type="text" id="released" placeholder="Released?(true/false)" required>
            <input type="text" id="finished" placeholder="Finished?(true/false)" required>
            <input type="text" id="gameurl" placeholder="Game URL">
            <input type="text" id="image" placeholder="Image URL">
            <button type="submit">Create Game</button>

        </form>

        <div id="createMsg"></div>

    </div>


    <!-- EDIT -->
    <div class="card" id="editSection" style="display:none;">

        <h2>Edit Game</h2>

            <input type="text" id="editid" placeholder="Enter _ID (_id required)" required>
            <input type="text" id="edittitle" placeholder="New Name">
            <input type="text" id="editprice" placeholder="New Price">
            <input type="text" id="editgenre" placeholder="New Genre">
            <input type="text" id="editreleased" placeholder="New Released?(true/false)">
            <input type="text" id="editfinished" placeholder="New Finished?(true/false)">
            <input type="text" id="editgameurl" placeholder="New Game URL">
            <input type="text" id="editimage" placeholder="New Image URL">

        <div class="actions">

        <button id="saveEditBtn">
            Update Product
        </button>

        <button id="cancelEditBtn">
            Cancel
        </button>

        </div>

        <br><div id="editMsg"></div>

    </div>


    <!-- READ -->
    <div class="card full">

        <h2>All Games</h2>

        <!-- games.js injects actual MongoDB data here -->
        <div id="products" class="products"></div>

    </div>

</div>


<style>

body{
margin:0;
font-family:Arial;
background:#edefeb;
}

header{
background:#c3ffbc;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
color:#4f8988;
}

header button{
background:#4f8988;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
cursor:pointer;
}

.container{
padding:30px;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.game-card {
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.full{
grid-column:span 2;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card h2{
color:#4f8988;
}

form{
display:flex;
flex-direction:column;
gap:10px;
}

input{
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#4f8988;
color:white;
cursor:pointer;
}

button:hover{
background:#406e6e;
}

.products{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(220px,1fr));
gap:15px;
}

.product{
border:2px solid #78a300;
padding:10px;
border-radius:10px;
background:#fff;
}

.actions{
display:flex;
gap:10px;
margin-top:10px;
}

@media(max-width:768px){

.container{
grid-template-columns:1fr;
}

.full{
grid-column:span 1;
}

}

</style>


<script src="js/games.js"></script>

</body>
</html>
